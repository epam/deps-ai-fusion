apiVersion: v1
kind: Service
metadata:
  name: ai-fusion
  labels:
    {{- include "deps-ai-fusion.labels" . | nindent 4 }}
    app.kubernetes.io/component: ai-fusion
spec:
  type: {{ .Values.ai_fusion.service.type }}
  ports:
    - port: {{ .Values.ai_fusion.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "deps-ai-fusion.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: ai-fusion