{{- if .Values.vault_settings.hashicorp_vault }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ .Values.csi.csi_default_name }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "3"
spec:
  provider: vault
  secretObjects:
  - data:
    - key: database-host
      objectName: database-host
    - key: database-db
      objectName: database-db
    - key: user
      objectName: user
    - key: password
      objectName: password
    secretName: {{ .Values.secrets.deps_ai_fusion_migrator.secretName }}
    type: Opaque
  parameters:
    roleName: "{{ .Values.csi.roleName }}"
    vaultAddress: "https://vault_host"
    vaultNamespace: "vault_namespace"
    vaultSkipTLSVerify: "true"
    #vaultCACertPath: ""
    vaultKubernetesMountPath: {{ .Values.csi.vaultKubernetesMountPath }}
    objects: |
      - objectName: "database-host"
        secretPath: "{{ .Values.csi.vault_namespace }}/data/common-secret"
        secretKey: "database-host"
      - objectName: "database-db"
        secretPath: "{{ .Values.csi.vault_namespace }}/data/deps-ai-fusion/ai-fusion-database"
        secretKey: "database-db"
      - objectName: "user"
        secretPath: "{{ .Values.csi.vault_namespace }}/data/deps-ai-fusion/ai-fusion-database"
        secretKey: "user"
      - objectName: "password"
        secretPath: "{{ .Values.csi.vault_namespace }}/data/deps-ai-fusion/ai-fusion-database"
        secretKey: "password"
{{- end }}
