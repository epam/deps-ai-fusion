[tool:pytest]
cache_dir = /tmp/test_cache/.pytest_cache

[flake8]
ignore =
    D100, 
	# Missing docstring in public module
    D101,
	# Missing docstring in public class
    D103, 
	# Missing docstring in public function
    D104, 
	# Missing docstring in public package
    B008, 
	# Do not perform function calls in argument defaults.  The call is performed only once at function definition time.
    WPS306, 
	# Class without a base class
    WPS348, 
	# Found a line that starts with a dot
    WPS111, 
	# Found too short name
    D107, 
	# Missing docstring in __init__
    D102, 
	# Missing docstring in public method
    DAR101, 
	# Missing parameter(s) in Docstring
    DAR201, 
	# Missing "Returns" in Docstring
    E800, 
	# Found commented out code
    WPS305, 
	# Found `f` string
    W503, 
	# Line break before binary operator
    WPS115, 
	# Found upper-case constant in a class
    WPS600, 
	# Found subclassing a builtin
    Q000, 
	# Double quotes found but single quotes preferred
    WPS201, 
	# Found module with too many imports
    WPS211, 
	# Found too many arguments
    WPS300, 
	# Found local folder import
    WPS404, 
	# Found complex default value
    WPS229, 
	# Found too long ``try`` body length
    WPS412, 
	# Found `__init__.py` module with logic
    WPS420, 
	# Found wrong keyword: pass
    WPS431, 
	# Found nested class:
    WPS110, 
	# Found wrong variable name
    D106, 
	# Missing docstring in public nested class
    WPS226, 
	# Found string constant over-use
    WPS237,  
	# Found a too complex `f` string
    WPS221, 
	# Found line with high Jones Complexity: 16 > 14
    WPS421,  
	# Found wrong function call
    D,      
	# Remove all docstring rules
    WPS601,  
	# Found shadowed class attribute
    WPS602, 
	# Found using `@staticmethod`
    WPS604, 
	# Found incorrect node inside `class` body
    WPS410,  
	# Found wrong metadata variable: __all__
    WPS609, 
	# Found direct magic attribute usage: __all__
    F403,  
	# used; unable to detect undefined names
    WPS347, 
	# Found vague import that may cause confusion: *
    WPS440, 
	# Found block variables overlap: *
    F405,
    WPS453,  
	# Found executable mismatch: file is executable but no shebang is present
    WPS323,  
	# Found `%` string formatting

    WPS326,
    # Found implicit string concatenation

    # Long if conditions in Domain Value Object
    WPS222,
    # Allow exceptions to be named without `Error` suffix
    N818,
    # Allow walrus operator
    WPS332,
    # Found too many imported names from a module
    WPS235,
    # Found multiline loop
    WPS352,
    # allowing yield instead of yield from for better readability
    WPS526,
    # wemake-python-styleguide added some crap in new version
    E251, E202, WPS504,
    # We allow long code lines, because where lot's of prompts:
    E501,
    # Found a getter without a return value
    WPS463,
    # Found too many module members
    WPS202,
    # Found inconsistent `return` statement
    WPS324,

exclude =
    .git,
    __pycache__,
    tests,
    vendors,
    .venv

per-file-ignores =
	# There are multiple `assert`s in tests, we allow them:
    src/tests/*.py: S101
    ./deps_ai_fusion/entrypoint/*.py: WPS421, WPS433, WPS430, WPS212
    ./deps_ai_fusion/containers.py: WPS202, WPS203
    ./deps_ai_fusion/api/fastapi_auth.py: WPS430, WPS433
    ./deps_ai_fusion/api/auth.py: WPS324
    ./deps_ai_fusion/extras/datasource/backoff.py: WPS232, WPS231, WPS430, WPS220
    ./deps_ai_fusion/domain/model/conversation/conversation.py: E203, WPS214
    ./deps_ai_fusion/infrastructure/repositories/conversation/query_factory.py: RST203, WPS317
    ./deps_ai_fusion/application/extraction.py: WPS331
    ./deps_ai_fusion/application/analysis.py: WPS331
    ./deps_ai_fusion/domain/model/llm_extractor/extraction_params.py: WPS358
    ./deps_ai_fusion/domain/model/llm_extractor/llm_extractor.py: WPS230, WPS214
    ./deps_ai_fusion/infrastructure/tables/llm_extractor.py: P103
    ./deps_ai_fusion/messaging/sagas/sagas_data/create_llm_extractor_data.py: WPS230
    ./deps_ai_fusion/application/llm_extraction.py: WPS214, WPS331, WPS231, WPS220
    ./deps_ai_fusion/infrastructure/repositories/llm_extractor/repository.py: WPS214
    ./deps_ai_fusion/application/structured_outputs/reasoning.py: WPS529
    ./deps_ai_fusion/infrastructure/agent/agentic_workflow_factory/workflow_factory.py: WPS213
    ./deps_ai_fusion/infrastructure/agent/response.py: WPS231
    ./deps_ai_fusion/application/llm_coordinates.py: WPS220, WPS231 
    ./deps_ai_fusion/infrastructure/services/coordinates_processor.py: WPS231, WPS220
    ./deps_ai_fusion/infrastructure/services/llm_coordinates/*.py: F401, WPS232, WPS202, WPS518, WPS210, E203, WPS220, WPS231, WPS358, WPS400, WPS414, WPS100, WPS349, WPS342

max-local-variables = 15
max-methods = 10
max-line-length = 120

[mypy]
ignore_missing_imports = True
follow_imports = skip
follow_imports_for_stubs = False
cache_dir = /tmp/test_cache/.mypy_cache
strict_optional = False
disable_error_code = attr-defined, name-defined

[isort]
profile = black
multi_line_output = 3
skip =
    vendors
    .venv

[coverage:run]
omit =
    tests/*
    */__init__.py
    /app/.venv/*
    /vendors/*
branch = True
data_file = /tmp/test_cache/.coverage

[ipdb]
context = 21
